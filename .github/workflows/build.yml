name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build portable executable
        shell: pwsh
        run: ./build.ps1
      - name: Simulation, settings and renderer checks
        shell: pwsh
        run: |
          New-Item -ItemType Directory artifacts -Force | Out-Null
          $result = Start-Process ./dist/QuietWinter.exe -ArgumentList '--self-test', "$PWD/artifacts/self-test.json" -Wait -PassThru
          Get-Content ./artifacts/self-test.json
          if ($result.ExitCode -ne 0) { throw 'Self-tests failed' }
      - name: Public repository checks
        run: python tests/check_repository.py
      - uses: actions/upload-artifact@v7
        with:
          name: QuietWinter-windows-x64
          path: |
            dist/QuietWinter.exe
            artifacts/self-test.json
